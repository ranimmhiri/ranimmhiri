<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440">
<style>
.bg{fill:#0d1117}
.blob{animation:drift 14s ease-in-out infinite alternate}
.b2{animation-duration:18s;animation-direction:alternate-reverse}
@keyframes drift{0%{transform:translate(0,0)}100%{transform:translate(60px,30px)}}
.fade{animation:up 1s cubic-bezier(.2,.7,.2,1) backwards}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.line{stroke-dasharray:260;stroke-dashoffset:0;animation:draw 1.4s .9s ease backwards}
@keyframes draw{from{stroke-dashoffset:260}to{stroke-dashoffset:0}}
.edge{stroke:#58a6ff;stroke-width:1;opacity:.12;animation:glow 4s ease-in-out infinite}
@keyframes glow{0%,100%{opacity:.10}50%{opacity:.55}}
.node{fill:#a371f7;animation:pulse 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{0%,100%{opacity:.45;transform:scale(1)}50%{opacity:1;transform:scale(1.5)}}
.dot{animation:blink 1.6s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
</style>
<defs>
 <radialGradient id="g1"><stop offset="0" stop-color="#1f6feb" stop-opacity=".45"/><stop offset="1" stop-color="#1f6feb" stop-opacity="0"/></radialGradient>
 <radialGradient id="g2"><stop offset="0" stop-color="#8957e5" stop-opacity=".40"/><stop offset="1" stop-color="#8957e5" stop-opacity="0"/></radialGradient>
 <linearGradient id="txt" x1="0" x2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#c9b8ff"/></linearGradient>
 <linearGradient id="ln" gradientUnits="userSpaceOnUse" x1="82" x2="342" y1="0" y2="0"><stop offset="0" stop-color="#58a6ff"/><stop offset="1" stop-color="#a371f7"/></linearGradient>
 <clipPath id="r"><rect width="1200" height="440" rx="22"/></clipPath>
</defs>
<g clip-path="url(#r)">
 <rect class="bg" width="1200" height="440"/>
 <circle class="blob" cx="980" cy="120" r="300" fill="url(#g1)"/>
 <circle class="blob b2" cx="760" cy="420" r="280" fill="url(#g2)"/>
 <g><line x1="820" y1="120" x2="900" y2="80" class="edge" style="animation-delay:0.00s"/><line x1="900" y1="80" x2="990" y2="140" class="edge" style="animation-delay:0.25s"/><line x1="990" y1="140" x2="1080" y2="95" class="edge" style="animation-delay:0.50s"/><line x1="820" y1="120" x2="860" y2="220" class="edge" style="animation-delay:0.75s"/><line x1="900" y1="80" x2="860" y2="220" class="edge" style="animation-delay:1.00s"/><line x1="990" y1="140" x2="960" y2="250" class="edge" style="animation-delay:1.25s"/><line x1="860" y1="220" x2="960" y2="250" class="edge" style="animation-delay:1.50s"/><line x1="960" y1="250" x2="1060" y2="210" class="edge" style="animation-delay:1.75s"/><line x1="1080" y1="95" x2="1060" y2="210" class="edge" style="animation-delay:2.00s"/><line x1="1060" y1="210" x2="1130" y2="280" class="edge" style="animation-delay:2.25s"/><line x1="960" y1="250" x2="900" y2="330" class="edge" style="animation-delay:2.50s"/><line x1="900" y1="330" x2="1010" y2="350" class="edge" style="animation-delay:2.75s"/><line x1="1010" y1="350" x2="1100" y2="370" class="edge" style="animation-delay:3.00s"/><line x1="1130" y1="280" x2="1100" y2="370" class="edge" style="animation-delay:3.25s"/><line x1="1060" y1="210" x2="1010" y2="350" class="edge" style="animation-delay:3.50s"/><line x1="860" y1="220" x2="820" y2="300" class="edge" style="animation-delay:3.75s"/><line x1="820" y1="300" x2="900" y2="330" class="edge" style="animation-delay:4.00s"/><line x1="990" y1="140" x2="1060" y2="210" class="edge" style="animation-delay:4.25s"/><circle cx="820" cy="120" r="6" class="node" style="animation-delay:0.00s"/><circle cx="900" cy="80" r="4" class="node" style="animation-delay:0.37s"/><circle cx="990" cy="140" r="4" class="node" style="animation-delay:0.74s"/><circle cx="1080" cy="95" r="6" class="node" style="animation-delay:1.11s"/><circle cx="860" cy="220" r="4" class="node" style="animation-delay:1.48s"/><circle cx="960" cy="250" r="4" class="node" style="animation-delay:1.85s"/><circle cx="1060" cy="210" r="6" class="node" style="animation-delay:2.22s"/><circle cx="1130" cy="280" r="4" class="node" style="animation-delay:2.59s"/><circle cx="900" cy="330" r="4" class="node" style="animation-delay:2.96s"/><circle cx="1010" cy="350" r="6" class="node" style="animation-delay:3.33s"/><circle cx="1100" cy="370" r="4" class="node" style="animation-delay:3.70s"/><circle cx="820" cy="300" r="4" class="node" style="animation-delay:4.07s"/></g>
 <rect width="1199" height="439" x=".5" y=".5" rx="22" fill="none" stroke="#30363d"/>
</g>
<g font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif">
 <text x="80" y="110" class="fade" style="animation-delay:.1s" fill="#58a6ff" font-size="15" font-weight="600" letter-spacing="5">PORTFOLIO  ·  AI &amp; DATA</text>
 <text x="76" y="200" class="fade" style="animation-delay:.3s" fill="url(#txt)" font-family="Georgia, 'Times New Roman', serif" font-size="84">Ranim Mhiri</text>
 <line x1="82" y1="232" x2="342" y2="232" stroke="url(#ln)" stroke-width="3" stroke-linecap="round" class="line"/>
