 <text x="80" y="316" class="fade" style="animation-delay:.8s" fill="#8b949e" font-size="17">MSc AI &amp; Data — Université Paris Dauphine-PSL</text>
 <g class="fade" style="animation-delay:1.1s">
  <rect x="80" y="348" width="300" height="38" rx="19" fill="#0f2a1a" stroke="#238636"/>
