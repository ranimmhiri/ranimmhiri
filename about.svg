<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="190" viewBox="0 0 1200 190" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif">
<style>.fade{animation:up .9s cubic-bezier(.2,.7,.2,1) backwards}@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}</style>
<defs><linearGradient id="ln" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#58a6ff"/><stop offset="1" stop-color="#a371f7"/></linearGradient></defs>
<g class="fade" style="animation-delay:0.15s">
 <rect x="40" y="20" width="360" height="150" rx="16" fill="#161b22" stroke="#30363d"/>
 <rect x="40" y="20" width="4" height="150" rx="2" fill="url(#ln)"/>
 <text x="70" y="62" fill="#58a6ff" font-size="13" font-weight="700" letter-spacing="3">FOCUS</text>
 <text x="70" y="102" fill="#e6edf3" font-family="Georgia, 'Times New Roman', serif" font-size="23">Natural Language Processing</text>
 <text x="70" y="136" fill="#8b949e" font-size="16">LLMs, RAG &amp; retrieval systems</text>
</g><g class="fade" style="animation-delay:0.35s">
 <rect x="420" y="20" width="360" height="150" rx="16" fill="#161b22" stroke="#30363d"/>
 <rect x="420" y="20" width="4" height="150" rx="2" fill="url(#ln)"/>
 <text x="450" y="62" fill="#58a6ff" font-size="13" font-weight="700" letter-spacing="3">CURRENTLY</text>
 <text x="450" y="102" fill="#e6edf3" font-family="Georgia, 'Times New Roman', serif" font-size="23">Building models from scratch</text>
 <text x="450" y="136" fill="#8b949e" font-size="16">seq2seq, attention, ensembles</text>
</g><g class="fade" style="animation-delay:0.55s">
 <rect x="800" y="20" width="360" height="150" rx="16" fill="#161b22" stroke="#30363d"/>
 <rect x="800" y="20" width="4" height="150" rx="2" fill="url(#ln)"/>
 <text x="830" y="62" fill="#58a6ff" font-size="13" font-weight="700" letter-spacing="3">LOOKING FOR</text>
 <text x="830" y="102" fill="#e6edf3" font-family="Georgia, 'Times New Roman', serif" font-size="23">An ML / NLP internship</text>
 <text x="830" y="136" fill="#8b949e" font-size="16">to ship models that matter</text>
</g>
</svg>